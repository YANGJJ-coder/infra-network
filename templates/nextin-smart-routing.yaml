# Config Generator runtime template. The server injects current 3X-UI proxies.
mode: rule
log-level: warning
ipv6: true

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: true
  use-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 1.1.1.1
  nameserver:
    - https://dns.alidns.com/dns-query
  fallback:
    - https://doh-pure.onedns.net/dns-query
    - https://ada.openbld.net/dns-query
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query
    - https://doh.dns.sb/dns-query
    - https://dns.cloudflare.com/dns-query
    - https://dns.twnic.tw/dns-query
    - tls://8.8.4.4:853
  fallback-filter:
    geoip: true
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - 'time.*.com'
    - '+.pool.ntp.org'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'

proxy-groups:
  - name: PROXY
    type: select
    include-all-proxies: true
    proxies:
      - AUTO
      - DIRECT
  - name: AI-US
    type: select
    proxies:
      - HS-US-01-Bandwagon
  - name: AUTO
    type: url-test
    include-all-proxies: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80

rule-providers:
  ads: {type: http, behavior: domain, format: yaml, interval: 86400, path: ./rules/ads.yaml, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.yaml", proxy: PROXY}
