rules:
  - RULE-SET,ads,REJECT
  - RULE-SET,openai,PROXY
  - RULE-SET,claude,PROXY
  - RULE-SET,anthropic,PROXY
  - RULE-SET,google,PROXY
  - RULE-SET,github,PROXY
  - RULE-SET,docker,PROXY
  - RULE-SET,huggingface,PROXY
  - DOMAIN-SUFFIX,ai.cloudflare.com,PROXY
  - DOMAIN-SUFFIX,workers.ai,PROXY
  - RULE-SET,youtube,PROXY
  - RULE-SET,netflix,PROXY
  - RULE-SET,disney,PROXY
  - RULE-SET,apple-tvplus,PROXY
  - RULE-SET,primevideo,PROXY
  - RULE-SET,reddit,PROXY
  - RULE-SET,twitter,PROXY
  - RULE-SET,telegram,PROXY
  - DOMAIN-SUFFIX,local,DIRECT
  - IP-CIDR,0.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - RULE-SET,private,DIRECT
  - RULE-SET,cn,DIRECT
  - RULE-SET,baidu,DIRECT
  - RULE-SET,tencent,DIRECT
  - RULE-SET,alibaba,DIRECT
  - RULE-SET,jd,DIRECT
  - RULE-SET,feishu,DIRECT
  - RULE-SET,dingtalk,DIRECT
  - RULE-SET,gitee,DIRECT
  - RULE-SET,apple-cn,DIRECT
  - RULE-SET,microsoft-cn,DIRECT
  - DOMAIN-SUFFIX,gitcode.com,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,PROXY
