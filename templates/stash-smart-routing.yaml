# Stash Rule Mode profile/override. Add the existing VLESS node or subscription in Stash, then select it in PROXY.
# DNS uses encrypted Remote DNS; no system DNS fallback is configured.
mode: rule
log-level: warning
ipv6: true
proxies: []

dns:
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver: ["https://cloudflare-dns.com/dns-query", "https://dns.google/dns-query"]
  nameserver-policy:
    'geosite:cn,private,apple-cn,microsoft@cn': ["https://doh.pub/dns-query", "https://dns.alidns.com/dns-query"]
    'geosite:category-ads-all': rcode://success
  fake-ip-filter: ['+.stun.*.*', '+.stun.*.*.*', '+.pool.ntp.org', '*.msftconnecttest.com', '*.msftncsi.com']

proxy-groups:
  - {name: PROXY, type: select, proxies: [DIRECT]}

rule-providers:
  ads: {type: http, behavior: domain, format: yaml, interval: 86400, path: ./rules/ads.yaml, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.yaml"}
  private: {type: http, behavior: domain, format: yaml, interval: 86400, path: ./rules/private.yaml, url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.yaml"}
